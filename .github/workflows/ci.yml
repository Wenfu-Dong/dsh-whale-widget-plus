name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 模块导入审计（module-import-audit）要真实加载 backend/src 模块：依赖 workspace 包
      # dsh-dfy-core 和 js-yaml 等。干净 clone 不装依赖时它会整片报「Cannot find package」。
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 门禁清单只有一份：scripts/ci-gate.mjs（本地 `npm run gate` 跑的是同一套）。
      # 不要再往这里加检查项 —— 加在 gate 脚本里，否则 ci / publish 两份清单必然漂移。
      - name: CI 门禁（单一清单：scripts/ci-gate.mjs）
        run: node scripts/ci-gate.mjs
