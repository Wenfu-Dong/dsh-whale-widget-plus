name: Publish gate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 同 ci.yml：模块导入审计需要真实 node_modules（workspace 包 + js-yaml 等）。
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 发版专属检查：tag 必须等于 package.json 的版本，否则会发出"标签写 v0.7.4、
      # 包内却是 0.7.3"的版本 —— 用户更新检查永远对不上。
      - name: tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "只接受 v* tag（当前：$tag）"; exit 1 ;;
          esac
          ver=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$ver" ]; then
            echo "tag $tag ≠ package.json v$ver"
            exit 1
          fi
          echo "OK: $tag"

      # 其余检查与日常 CI 完全同一份清单（scripts/ci-gate.mjs），不要在这里重复登记。
      - name: CI 门禁（单一清单：scripts/ci-gate.mjs）
        run: node scripts/ci-gate.mjs
